<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamepad Tester Pro - xCapitann</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Gamepad Tester Pro</h1>
        <div id="status" class="disconnected">DESCONECTADO - Presiona un botón</div>
        
     <div class="image-container">
    <img id="img-ps" class="ps-style" src="https://raw.githubusercontent.com/xcapitann/control-tester/main/image/ps4.png" alt="PS4" style="display:none;">
    <img id="img-xbox" class="xbox-style" src="https://raw.githubusercontent.com/xcapitann/control-tester/main/image/xboxone.png" alt="Xbox" style="display:none;">
    <img id="img-generic" class="generic-style" src="https://via.placeholder.com/300x200/222/fff?text=Mando+Genérico" alt="Generic" style="display:none;">
</div>

        <div id="controller-info">Esperando señal...</div>
    </div>

    <div class="sticks-container">
    <div>
        <small>Stick Izquierdo (L3)</small>
        <div class="stick-viewer"><div id="dot-l" class="stick-dot"></div></div>
    </div>
    <div>
        <small>Stick Derecho (R3)</small>
        <div class="stick-viewer"><div id="dot-r" class="stick-dot"></div></div>
    </div>
</div>
    
<!-- Debajo de <div id="controller-info">...</div> -->
<div id="buttons-display" class="buttons-grid"></div>
    
    <script src="script.js"></script>

 </body>
</html>
