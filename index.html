<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamepad Tester Pro - xCapitann</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div style="text-align: center; margin-top: 20px;">
    <img src="https://www.reliablecounter.com/count.php?page=xcapitann.github.io/control-tester/&digit=style/plain/6/&reloads=0" alt="contador de visitas" border="0">
    <p style="color: #555; font-size: 10px; font-family: sans-serif;">VISITAS</p>
</div>
	
<div class="container">
        <h1>Gamepad Tester Pro</h1>
        <div id="status" class="disconnected">DESCONECTADO - Presiona un botón</div>
        
     <div class="image-container">
    <img id="img-ps" class="ps-style" src="image/ps4.png" alt="PS4">
    <img id="img-xbox" class="xbox-style" src="image/xboxone.png" alt="Xbox">
    <img id="img-generic" class="generic-style" src="image/generico.png alt="Generic">
</div>

        <div id="controller-info">Esperando señal...</div>
    </div>

    <div class="sticks-container">
    <div>
        <small>Stick Izquierdo (L3)</small>
        <div class="stick-viewer"><div id="dot-l" class="stick-dot"></div></div>
    </div>
    <div>
        <small>Stick Derecho (R3)</small>
        <div class="stick-viewer"><div id="dot-r" class="stick-dot"></div></div>
    </div>
</div>
    
<!-- Debajo de <div id="controller-info">...</div> -->
<div id="buttons-display" class="buttons-grid"></div>
  
    <script src="script.js"></script>
 
 </body>

<!-- 👤 Autor -->
  <div class="author">
    Capitán N © 2026 
 <p>
  <div class="version">
	Control Tester - Version 1.0.0
	</div>
  </div>
 
</html>
